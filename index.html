    arrowDown: '<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>',
    send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
    code: '<path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/>',
    gamepad: '<path d="M6 12h4"/><path d="M8 10v4"/><path d="M15 13h.01"/><path d="M18 11h.01"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258A4 4 0 0 0 17.32 5z"/>',
    school: '<path d="M22 10v6"/><path d="M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>',
    rotate: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
    whatsapp: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1.2-1.4-2-1-.8.8c-.9-.4-1.6-1.1-2-2l.8-.8-1-2z"/>',
    instagram: '<rect width="20" height="20" x="2" y="2" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/>',
    tiktok: '<path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"/>'
  };
  const BRANDS = {
    whatsapp:  { bg: 'bg-green-600', url: v => 'https://wa.me/' + v.replace(/\D/g, '').replace(/^0/, '62') },
    instagram: { bg: 'bg-gradient-to-tr from-yellow-500 via-pink-600 to-purple-600', url: v => 'https://instagram.com/' + v.replace(/^@/, '') },
    tiktok:    { bg: 'bg-black border border-zinc-700', url: v => 'https://tiktok.com/@' + v.replace(/^@/, '') }
  };
  const fill = s => String(s ?? '').replace(/\{(\w+)\}/g, (_, k) => TX[k] ?? '');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const icon = n => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;
  const rv = (dir = 'up', delay = 0) => CONFIG.features.animations ? `class-rv data-rv="${dir}" style="transition-delay:${delay}ms"` : '';
  const tx = s => esc(fill(s));
  const $ = s => document.querySelector(s);

  const render = () => {
    const C = CONFIG, T = C.theme, root = document.documentElement.style;
    root.setProperty('--bg', T.background); root.setProperty('--accent', T.accent);
    root.setProperty('--accent-dark', T.accentDark); root.setProperty('--accent-text', T.accentText);
    document.title = fill(TX.pageTitle);
    if (!C.features.blobBackground) $('#blobs').remove();

    $('#nav').innerHTML = C.nav.map(n => `<a href="${esc(n.href)}" class="text-sm font-bold hover:text-red-500 ${n.highlight ? 'text-red-500' : 'text-slate-300'}">${tx(TX.nav[n.id])}</a>`).join('');

    const H = C.hero, X = TX.hero;
    $('#hero').innerHTML = `
      <div ${rv('left')} class="hero-copy">
        <span class="hero-kicker"><span class="kicker-dot"></span> ${tx(X.badge)}</span>
        <p class="hero-eyebrow">${tx(X.greeting)}</p>
        <h1 class="hero-title">${tx(X.titlePrefix)} <span>${esc(TX.name)}</span></h1>
        <p class="hero-description">${tx(X.description)}</p>
        <div class="hero-actions">${H.buttons.map(b => `<a href="${esc(b.href)}" class="${b.primary ? 'primary-action' : 'secondary-action'}">${tx(X.buttons[b.id])} ${icon(b.icon)}</a>`).join('')}</div>
        <div class="hero-meta">${H.meta.map(m => `<span>${icon(m.icon)} ${tx(X.meta[m.id])}</span>`).join('')}</div>
      </div>
      <div ${rv('right')} class="hero-visual">
        <div class="hero-orbit orbit-one"></div><div class="hero-orbit orbit-two"></div>
        <div class="profile-frame">
          <div class="profile-topline"><span>${tx(X.profileLabel)}</span><span>${esc(TX.year)}</span></div>
          <img class="profile-photo" src="${esc(C.photo)}" alt="${tx(X.photoAlt)}">
          <div class="profile-caption"><span class="profile-status"></span><div><strong>${esc(TX.name)}</strong><small>${tx(X.role)}</small></div></div>
        </div>
        ${H.chips.map(c => `<div class="floating-chip ${esc(c.pos)}">${icon(c.icon)} ${tx(X.chips[c.id])}</div>`).join('')}
      </div>`;

    const S = C.skills, Y = TX.skills, E = C.education, Z = TX.education;
    $('#aboutRoot').innerHTML = `
      <div ${rv()}><h2 class="text-3xl font-extrabold mb-4 text-white">${tx(TX.about.title)}</h2><p class="text-slate-400">${tx(TX.about.text)}</p></div>
      <div class="skills-panel" ${rv('up', 150)}>
        <div class="skills-intro"><span class="section-kicker">${tx(Y.kicker)}</span>
          <h3 class="text-2xl md:text-3xl font-extrabold text-white mt-2">${tx(Y.title)}</h3>
          <p class="text-slate-400 mt-3 max-w-2xl mx-auto">${tx(Y.desc)}</p></div>
        <div class="skills-layout">
          <div class="chart-wrap">
            <svg id="skillChart" class="skill-chart" viewBox="0 0 320 320" role="img" aria-label="${tx(Y.chartAria)}">
              <circle cx="160" cy="160" r="112" class="chart-track"></circle><g id="chartSegments"></g>
              <circle cx="160" cy="160" r="77" class="chart-hole"></circle>
              <text x="160" y="151" text-anchor="middle" class="chart-center-label">${tx(Y.centerLabel)}</text>
              <text x="160" y="178" text-anchor="middle" class="chart-center-sub">${tx(Y.centerSub)}</text>
            </svg>
            ${C.features.rotateChart ? `<div class="chart-hint">${icon('rotate')} ${tx(Y.hint)}</div>` : ''}
          </div>
          <div class="skills-legend" id="skillsLegend">
            ${S.map(s => `<div class="skill-row"><span class="skill-swatch" style="--swatch:${esc(s.color)}"></span><div class="skill-info"><strong>${tx(Y.items[s.id][0])}</strong><small>${tx(Y.items[s.id][1])}</small></div></div>`).join('')}
            <p class="skills-note">${tx(Y.note)}</p>
          </div>
        </div>
      </div>
      <div class="mt-24 relative max-w-3xl mx-auto" ${rv()}>
        <h2 class="text-3xl font-extrabold text-center mb-12 text-white">${tx(Z.title)}</h2>
        <div class="absolute left-6 md:left-1/2 top-24 bottom-0 w-1 bg-red-900/40 md:-translate-x-1/2"></div>
        <div class="space-y-12 relative z-10">${E.map((e, i) => {
          const t = Z.items[e.id];
          const left = i % 2 === 0, tone = left ? 'red' : 'rose';
          const body = e.current
            ? `<div class="glass p-5 rounded-2xl border-red-500/40"><span class="bg-red-950/80 border border-red-500/30 text-red-400 text-xs font-bold px-2 py-1 rounded mb-2 inline-block">${tx(t.tag)}</span><h4 class="text-xl font-bold text-white">${tx(t.school)}</h4><p class="text-red-500 font-semibold text-sm">${tx(t.major)}</p><p class="text-slate-400 text-sm mt-2">${tx(t.desc)}</p></div>`
            : `<h4 class="text-xl font-bold text-${tone}-500">${tx(t.school)}</h4><p class="text-slate-400 text-sm mt-1">${tx(t.desc)}</p>`;
          const dot = e.current ? 'bg-red-600 border-4 border-zinc-950 shadow-[0_0_15px_rgba(220,38,38,0.8)] animate-pulse' : `bg-zinc-950 border-4 border-${tone}-600`;
          const empty = '<div class="w-full md:w-1/2 hidden md:block"></div>';
          const text = `<div class="w-full md:w-1/2 ${left ? 'md:pr-12 text-left md:text-right pl-16 md:pl-0' : 'md:pl-12 text-left pl-16'}">${body}</div>`;
          return `<div class="flex flex-col md:flex-row items-center" ${rv()}>${left ? text : empty}<div class="absolute left-6 md:left-1/2 w-5 h-5 ${dot} rounded-full -translate-x-[10px] z-10"></div>${left ? empty : text}</div>`;
        }).join('')}</div>
      </div>`;

    const K = C.contact;
    $('#contactRoot').innerHTML = `
      <div class="text-center mb-12" ${rv()}><h2 class="text-3xl font-extrabold mb-2 text-white">${tx(TX.contact.title)}</h2><p class="text-slate-400 text-sm">${tx(TX.contact.subtitle)}</p></div>
      <div class="space-y-4 max-w-md mx-auto" ${rv()}>${K.items.map(it => {
        const b = BRANDS[it.type] || {};
        const url = it.url || (b.url ? b.url(it.value) : '#');
        return `<a href="${esc(url)}" target="_blank" rel="noopener" class="flex items-center gap-4 p-4 bg-zinc-900/50 border border-red-500/20 rounded-2xl hover:bg-zinc-800 group"><div class="w-14 h-14 ${b.bg || 'bg-zinc-700'} text-white rounded-xl flex items-center justify-center text-3xl group-hover:scale-110">${icon(it.type)}</div><div><h4 class="text-lg font-bold text-white">${tx(TX.contact.labels[it.type])}</h4>${K.showSubtext && TX.contact.subtexts[it.type] ? `<p class="text-sm text-slate-400">${tx(TX.contact.subtexts[it.type])}</p>` : ''}</div></a>`;
      }).join('')}</div>`;

    $('#footer').textContent = fill(TX.footer);
  };

  const initReveal = () => {
    const els = document.querySelectorAll('[class-rv]');
    const io = 'IntersectionObserver' in window && new IntersectionObserver((list, o) => list.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); o.unobserve(e.target); } }), { threshold: .12 });
    els.forEach(el => { el.classList.add('rv', 'rv-' + el.dataset.rv); io ? io.observe(el) : el.classList.add('in'); });
  };

  const initChart = () => {
    const svg = $('#skillChart'), group = $('#chartSegments'), items = CONFIG.skills;
    const R = 112, circ = 2 * Math.PI * R, total = items.reduce((s, i) => s + i.value, 0);
    let off = 0;
    const segs = items.map(s => {
      const len = circ * s.value / total, c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('class', 'chart-segment'); c.setAttribute('cx', 160); c.setAttribute('cy', 160); c.setAttribute('r', R);
      c.setAttribute('stroke', s.color); c.setAttribute('stroke-dasharray', `${len} ${circ - len}`);
      c.setAttribute('stroke-dashoffset', -off); c.setAttribute('transform', 'rotate(-90 160 160)'); c.style.color = s.color;
      group.appendChild(c); off += len; return c;
    });
    document.querySelectorAll('#skillsLegend .skill-row').forEach((row, i) => {
      [['mouseenter', 'focusin', 1], ['mouseleave', 'focusout', 0]].forEach(([a, b, on]) =>
        [a, b].forEach(ev => row.addEventListener(ev, () => segs[i].classList.toggle('active', !!on))));
    });
    if (!CONFIG.features.rotateChart) { svg.style.cursor = 'default'; return; }
    let rot = 0, drag = false, last = 0;
    const ang = e => { const r = svg.getBoundingClientRect(); return Math.atan2((e.clientY - r.top) * 320 / r.height - 160, (e.clientX - r.left) * 320 / r.width - 160) * 180 / Math.PI; };
    group.style.transformOrigin = '160px 160px';
    svg.addEventListener('pointerdown', e => { drag = true; last = ang(e); svg.setPointerCapture?.(e.pointerId); });
    svg.addEventListener('pointermove', e => {
      if (!drag) return;
      const a = ang(e); let d = a - last;
      if (d > 180) d -= 360; if (d < -180) d += 360;
      rot += d; last = a; group.style.transform = `rotate(${rot}deg)`;
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => svg.addEventListener(ev, () => drag = false));
  };

  const initPhoto = () => {
    const img = $('.profile-photo'), ini = fill('{name}').split(/\s+/).map(w => w[0]).join('').slice(0, 3).toUpperCase();
    const fallback = 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="#18181b"/><text x="200" y="240" font-family="sans-serif" font-size="120" font-weight="800" fill="${CONFIG.theme.accent}" text-anchor="middle">${ini}</text></svg>`);
    img.addEventListener('error', () => { img.src = fallback; }, { once: true });
  };

  document.addEventListener('DOMContentLoaded', () => { render(); initPhoto(); initChart(); initReveal(); });
  </script>
</body>
</html>
